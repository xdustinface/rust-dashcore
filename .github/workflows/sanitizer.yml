name: Sanitizer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - 'key-wallet-ffi/**'
      - 'dash-spv-ffi/**'
      - 'dashcore/**'
      - 'dashcore_hashes/**'
      - 'key-wallet/**'
      - 'dash-spv/**'

permissions:
  contents: read

# Pinned so a nightly regression cannot break the job unannounced. Keep it
# recent: a dependency that builds on stable can still fail on an old nightly,
# e.g. nightly-2026-07-13 has a builtin `unroll` attribute that makes
# `dash-pow`'s `unroll!` macro ambiguous.
env:
  SANITIZER_TOOLCHAIN: nightly-2026-10-26

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.SANITIZER_TOOLCHAIN }}
          components: rust-src

      - name: Run tests with ASAN
        env:
          RUST_BACKTRACE: 1
          RUSTFLAGS: "-Zsanitizer=address -Cdebuginfo=2 -Cforce-frame-pointers=yes"
          ASAN_OPTIONS: "symbolize=1:allow_addr2line=1"
          LSAN_OPTIONS: "fast_unwind_on_malloc=0"
          SKIP_DASHD_TESTS: 1
        run: |
          # FFI crates (C interop)
          cargo "+$SANITIZER_TOOLCHAIN" test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p key-wallet-ffi -p dash-spv-ffi --lib --tests

          # Core crypto crates (unsafe optimizations)
          cargo "+$SANITIZER_TOOLCHAIN" test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p dashcore -p dashcore_hashes --lib --tests

  tsan:
    name: Thread Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.SANITIZER_TOOLCHAIN }}
          components: rust-src

      - name: Run tests with TSAN
        env:
          RUST_BACKTRACE: 1
          RUSTFLAGS: "-Zsanitizer=thread -Cdebuginfo=2"
          TSAN_OPTIONS: "second_deadlock_stack=1"
          SKIP_DASHD_TESTS: 1
        run: |
          # Async crate with concurrent code
          cargo "+$SANITIZER_TOOLCHAIN" test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p dash-spv --lib --tests
